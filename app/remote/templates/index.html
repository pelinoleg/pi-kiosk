<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote</title>
  <link rel="icon" type="image/png" href="/static/icon.png">
  <link rel="apple-touch-icon" href="/static/icon.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <div class="remote" id="remote">
    <!-- Row 1: Power, Settings, Mute -->
    <button class="btn btn--round" data-key="power" style="grid-row:1; grid-column:1">
      <span class="btn__icon">&#x23FB;</span>
    </button>
    <button class="btn btn--round btn--settings" id="btn-settings" style="grid-row:1; grid-column:2">
      <span class="btn__icon">&#x2699;</span>
    </button>
    <button class="btn btn--round" data-key="mute" style="grid-row:1; grid-column:3">
      <span class="btn__icon">&#x1F507;</span>
    </button>
	

    <!-- Row 2: Pg+, Voice Log, Pg- -->
    <button class="btn" data-key="ch+" style="grid-row:2; grid-column:1"><span class="btn__label">Pg+</span></button>
    <button class="btn btn--round btn--log" id="btn-voice-log" style="grid-row:2; grid-column:2">
      <span class="btn__icon">&#x1F4DC;</span>
    </button>
    <button class="btn" data-key="ch-" style="grid-row:2; grid-column:3"><span class="btn__label">Pg-</span></button>

    <!-- Row 3-5: D-pad -->
    <button class="btn btn--dpad" data-key="up" style="grid-row:4; grid-column:2">
      <span class="btn__icon">&#x25B2;</span>
    </button>
    <button class="btn btn--dpad" data-key="left" style="grid-row:5; grid-column:1">
      <span class="btn__icon">&#x25C0;</span>
    </button>
    <button class="btn btn--ok" data-key="ok" style="grid-row:5; grid-column:2">
      <span class="btn__label">OK</span>
    </button>
    <button class="btn btn--dpad" data-key="right" style="grid-row:5; grid-column:3">
      <span class="btn__icon">&#x25B6;</span>
    </button>
    <button class="btn btn--dpad" data-key="down" style="grid-row:6; grid-column:2">
      <span class="btn__icon">&#x25BC;</span>
    </button>

    <!-- Row 7: Back, Home -->
    <button class="btn" data-key="back" style="grid-row:7; grid-column:1">
      <span class="btn__icon">&#x21A9;</span>
      <span class="btn__label">back</span>
    </button>
    <button class="btn btn--round" data-key="home" style="grid-row:7; grid-column:3">
      <span class="btn__icon">&#x2302;</span>
    </button>

    <!-- Row 8: Vol-, Voice, Vol+ -->
    <button class="btn" data-key="vol-" style="grid-row:8; grid-column:1">
      <span class="btn__icon">&#x1F509;</span>
    </button>
    <button class="btn" data-key="voice" style="grid-row:8; grid-column:2">
      <span class="btn__icon">&#x1F3A4;</span>
    </button>
    <button class="btn" data-key="vol+" style="grid-row:8; grid-column:3">
      <span class="btn__icon">&#x1F50A;</span>
    </button>

    <!-- Row 9: Prev, Play/Pause, Next -->
    <button class="btn" data-key="prev" style="grid-row:9; grid-column:1">
      <span class="btn__icon">&#x23EE;</span>
    </button>
    <button class="btn btn--round" data-key="play" style="grid-row:9; grid-column:2">
      <span class="btn__icon">&#x23EF;</span>
    </button>
    <button class="btn" data-key="next" style="grid-row:9; grid-column:3">
      <span class="btn__icon">&#x23ED;</span>
    </button>

    <!-- Row 10-12: Number pad -->
    <button class="btn" data-key="1" style="grid-row:10; grid-column:1"><span class="btn__label">1</span></button>
    <button class="btn" data-key="2" style="grid-row:10; grid-column:2"><span class="btn__label">2</span></button>
    <button class="btn" data-key="3" style="grid-row:10; grid-column:3"><span class="btn__label">3</span></button>
    <button class="btn" data-key="4" style="grid-row:11; grid-column:1"><span class="btn__label">4</span></button>
    <button class="btn" data-key="5" style="grid-row:11; grid-column:2"><span class="btn__label">5</span></button>
    <button class="btn" data-key="6" style="grid-row:11; grid-column:3"><span class="btn__label">6</span></button>
    <button class="btn" data-key="7" style="grid-row:12; grid-column:1"><span class="btn__label">7</span></button>
    <button class="btn" data-key="8" style="grid-row:12; grid-column:2"><span class="btn__label">8</span></button>
    <button class="btn" data-key="9" style="grid-row:12; grid-column:3"><span class="btn__label">9</span></button>

    <!-- Row 13: Delete, 0, Menu -->
    <button class="btn" data-key="delete" style="grid-row:13; grid-column:1">
      <span class="btn__label">DEL</span>
    </button>
    <button class="btn" data-key="0" style="grid-row:13; grid-column:2"><span class="btn__label">0</span></button>
    <button class="btn" data-key="menu" style="grid-row:13; grid-column:3">
      <span class="btn__icon">&#x2600;</span>
    </button>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <div class="modal__header">
        <h2 class="modal__title" id="modal-title"></h2>
        <button class="modal__close" id="modal-close">&times;</button>
      </div>

      <div class="modal__tabs">
        <button class="modal__tab modal__tab--active" data-tab="press">Нажатие</button>
        <button class="modal__tab" data-tab="longpress">Долгое нажатие</button>
      </div>

      <div class="modal__body">
        <!-- Press tab -->
        <div class="modal__panel" id="panel-press">
          <div class="action-list" id="actions-press"></div>
          <button class="add-action" id="add-press">+ Добавить действие</button>
        </div>

        <!-- Long press tab -->
        <div class="modal__panel modal__panel--hidden" id="panel-longpress">
          <div class="longpress-duration">
            <label>Удержание</label>
            <input type="number" id="longpress-seconds" min="0.5" step="0.5" value="3" placeholder="сек">
            <span>сек</span>
          </div>
          <div class="action-list" id="actions-longpress"></div>
          <button class="add-action" id="add-longpress">+ Добавить действие</button>
        </div>
      </div>

      <div class="modal__footer">
        <button class="modal__btn modal__btn--cancel" id="modal-cancel">Отмена</button>
        <button class="modal__btn modal__btn--save" id="modal-save">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Voice Log Modal -->
  <div class="modal-overlay" id="log-overlay">
    <div class="modal modal--log" id="log-modal">
      <div class="modal__header">
        <h2 class="modal__title">Voice Log</h2>
        <button class="modal__close" id="log-close">&times;</button>
      </div>
      <div class="modal__body">
        <div class="voice-log" id="voice-log-list"></div>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="settings-overlay">
    <div class="modal modal--settings" id="settings-modal">
      <div class="modal__header">
        <h2 class="modal__title">Voice Settings</h2>
        <button class="modal__close" id="settings-close">&times;</button>
      </div>

      <div class="modal__tabs">
        <button class="modal__tab modal__tab--active" data-stab="commands">Commands</button>
        <button class="modal__tab" data-stab="config">Config</button>
      </div>

      <div class="modal__body">
        <!-- Commands tab -->
        <div class="settings-panel" id="panel-commands">
          <div class="voice-commands-hint">
            <b>Name</b> — short name, visible in logs<br>
            <b>Keywords</b> — words and phrases in any language that should trigger this command. More synonyms = better matching<br>
            <b>URL</b> — HTTP GET request to execute
          </div>
          <div class="voice-commands-list" id="voice-commands-list"></div>
          <button class="add-action" id="add-voice-command">+ Add command</button>
        </div>

        <!-- Config tab -->
        <div class="settings-panel settings-panel--hidden" id="panel-config">
          <div class="settings-section">
            <label class="settings-label">
              <input type="checkbox" id="voice-enabled"> Voice control enabled
            </label>
          </div>

          <div class="settings-section">
            <h3 class="settings-heading">LLM Provider</h3>
            <div class="settings-radios">
              <label><input type="radio" name="provider" value="claude" checked> Claude</label>
              <label><input type="radio" name="provider" value="openai"> OpenAI</label>
            </div>
          </div>

          <div class="settings-section">
            <h3 class="settings-heading">Claude</h3>
            <div class="settings-field">
              <label>API Key</label>
              <input type="password" id="claude-api-key" placeholder="sk-ant-...">
            </div>
            <div class="settings-field">
              <label>Model</label>
              <input type="text" id="claude-model" placeholder="claude-haiku-4-5-20251001">
            </div>
          </div>

          <div class="settings-section">
            <h3 class="settings-heading">OpenAI</h3>
            <div class="settings-field">
              <label>API Key</label>
              <input type="password" id="openai-api-key" placeholder="sk-...">
            </div>
            <div class="settings-field">
              <label>Model</label>
              <input type="text" id="openai-model" placeholder="gpt-4o-mini">
            </div>
          </div>

          <div class="settings-section">
            <h3 class="settings-heading">Whisper</h3>
            <div class="settings-field">
              <label>Model</label>
              <select id="whisper-model">
                <option value="tiny">tiny</option>
                <option value="base">base</option>
                <option value="small" selected>small</option>
                <option value="medium">medium</option>
              </select>
            </div>
            <div class="settings-field">
              <label>Language</label>
              <input type="text" id="voice-language" placeholder="en">
            </div>
            <div class="settings-field">
              <label>Audio Device</label>
              <input type="text" id="audio-device" placeholder="plughw:0,0">
            </div>
          </div>
        </div>
      </div>

      <div class="modal__footer">
        <button class="modal__btn modal__btn--cancel" id="settings-cancel">Cancel</button>
        <button class="modal__btn modal__btn--save" id="settings-save">Save</button>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
