<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Киоск — TTS</title>
<link rel="icon" type="image/png" href="/surface/remote-icon-192.png">
<link rel="apple-touch-icon" href="/surface/remote-icon-192.png">
<meta name="theme-color" content="#101418">
<style>
  :root {
    --bg: #101418; --card: #1a2027; --line: #2a323c;
    --fg: #e8edf2; --dim: #8b98a5; --accent: #4fc3f7;
    --ok: #66bb6a; --bad: #ef5350;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 16px; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 480px; margin-inline: auto;
  }
  h1 { font-size: 20px; margin: 4px 0 16px; }
  h1 a { color: var(--dim); text-decoration: none; font-size: 14px; font-weight: normal; float: right; margin-top: 3px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px; margin-bottom: 14px;
  }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em;
             color: var(--dim); margin: 0 0 10px; }
  textarea {
    width: 100%; min-height: 110px; background: #0b0e12; color: var(--fg);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px;
    font-size: 17px; resize: vertical; font-family: inherit;
  }
  .chips { display: flex; gap: 8px; margin: 10px 0; }
  .chip {
    flex: 1; text-align: center; padding: 10px 0; border-radius: 10px;
    border: 1px solid var(--line); background: #232b34; cursor: pointer;
    font-size: 15px; user-select: none;
  }
  .chip.sel { background: #114d66; border-color: #1a6b8d; color: var(--accent); font-weight: 600; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .muted { color: var(--dim); font-size: 13px; }
  input[type=range] { flex: 1; accent-color: var(--accent); }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }
  button {
    width: 100%; min-height: 52px; border-radius: 12px; border: 1px solid #1a6b8d;
    background: #114d66; color: var(--fg); font-size: 17px; cursor: pointer;
  }
  button:active { background: #17607e; }
  .preset {
    display: flex; align-items: center; gap: 8px; padding: 10px 0;
    border-bottom: 1px solid var(--line);
  }
  .preset:last-child { border-bottom: none; }
  .preset span { flex: 1; font-size: 15px; cursor: pointer; }
  .preset i { color: var(--dim); font-style: normal; font-size: 12px; }
  .preset b {
    color: var(--bad); cursor: pointer; font-weight: normal; padding: 0 6px;
    font-size: 18px;
  }
  #add-preset {
    background: none; border: 1px dashed var(--line); color: var(--dim);
    min-height: 40px; font-size: 14px; margin-top: 8px;
  }
  #toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: #000d; color: var(--fg); padding: 10px 18px; border-radius: 10px;
    font-size: 14px; opacity: 0; transition: opacity .25s; pointer-events: none;
    max-width: 90vw; z-index: 10;
  }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<h1>Объявления (TTS) <a href="/surface/remote">← пульт</a></h1>

<div class="card">
  <textarea id="text" placeholder="Напечатай, что сказать…" autofocus></textarea>
  <div class="chips" id="langs">
    <div class="chip sel" data-lang="ro">RO</div>
    <div class="chip" data-lang="ru">RU</div>
    <div class="chip" data-lang="en">EN</div>
    <div class="chip" data-lang="es">ES</div>
  </div>
  <div class="row">
    <span class="muted">Громкость</span>
    <input type="range" id="vol" min="10" max="150" step="5" value="90">
    <span class="muted" id="vol-val">90%</span>
  </div>
  <div class="row">
    <label class="muted" style="display:flex;align-items:center;gap:8px">
      <input type="checkbox" id="ding" checked> сигнал перед речью
    </label>
    <label class="muted" style="display:flex;align-items:center;gap:8px">
      <input type="checkbox" id="slow"> медленно
    </label>
  </div>
  <button onclick="say()">🔊 Произнести на киоске</button>
</div>

<div class="card">
  <h2>Быстрые фразы</h2>
  <div id="presets"></div>
  <button id="add-preset" onclick="addPreset()">+ сохранить текущий текст как фразу</button>
</div>

<div id="toast"></div>

<script>
  const $ = id => document.getElementById(id);
  let toastTimer;
  function toast(msg, isError) {
    const el = $('toast');
    el.textContent = msg;
    el.style.color = isError ? 'var(--bad)' : 'var(--fg)';
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
  }

  // Настройки живут в localStorage телефона и переживают перезагрузки
  const saved = JSON.parse(localStorage.getItem('tts-settings') || '{}');
  let lang = saved.lang || 'ro';
  if (saved.vol) $('vol').value = saved.vol;
  if (saved.ding === false) $('ding').checked = false;
  if (saved.slow) $('slow').checked = true;
  $('vol-val').textContent = $('vol').value + '%';

  document.querySelectorAll('#langs .chip').forEach(chip => {
    chip.classList.toggle('sel', chip.dataset.lang === lang);
    chip.onclick = () => {
      document.querySelectorAll('#langs .chip').forEach(c => c.classList.remove('sel'));
      chip.classList.add('sel');
      lang = chip.dataset.lang;
      persist();
    };
  });
  $('vol').oninput = () => { $('vol-val').textContent = $('vol').value + '%'; };
  $('vol').onchange = persist;
  $('ding').onchange = persist;
  $('slow').onchange = persist;

  function persist() {
    localStorage.setItem('tts-settings', JSON.stringify({
      lang, vol: $('vol').value, ding: $('ding').checked, slow: $('slow').checked,
    }));
  }

  async function speak(text) {
    if (!text.trim()) { toast('Пустой текст', true); return; }
    toast('…');
    const params = new URLSearchParams({
      text: text.trim(), lang, volume: $('vol').value,
      notification: $('ding').checked, slow: $('slow').checked,
    });
    try {
      const r = await fetch('/surface/tts-say?' + params);
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.detail || r.status);
      toast('Играет (' + (data.engine === 'gtts' ? 'голос Google' : 'офлайн-голос') + ')');
    } catch (e) {
      toast('Ошибка: ' + e.message, true);
    }
  }

  function say() { speak($('text').value); }

  // ---- быстрые фразы ----
  const defaultPresets = [
    { text: 'Masa este gata!', lang: 'ro' },
    { text: 'Mergem la culcare.', lang: 'ro' },
    { text: 'Ema, vino aici, te rog.', lang: 'ro' },
  ];
  let presets = JSON.parse(localStorage.getItem('tts-presets') || 'null') || defaultPresets;

  function renderPresets() {
    $('presets').innerHTML = presets.map((p, i) =>
      `<div class="preset">
         <span onclick="playPreset(${i})">${p.text}</span>
         <i>${p.lang.toUpperCase()}</i>
         <b onclick="delPreset(${i})">×</b>
       </div>`).join('') || '<div class="muted">пока пусто</div>';
    localStorage.setItem('tts-presets', JSON.stringify(presets));
  }

  function playPreset(i) {
    const prev = lang;
    lang = presets[i].lang;
    speak(presets[i].text);
    lang = prev;
  }

  function addPreset() {
    const text = $('text').value.trim();
    if (!text) { toast('Сначала напечатай текст', true); return; }
    presets.push({ text, lang });
    renderPresets();
    toast('Сохранено');
  }

  function delPreset(i) {
    presets.splice(i, 1);
    renderPresets();
  }

  renderPresets();
</script>
</body>
</html>
